name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            mobile: ""
            args: --target x86_64-pc-windows-msvc --debug --verbose --no-bundle --no-sign -- --verbose

          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            mobile: ""
            args: --target aarch64-pc-windows-msvc --debug --verbose --no-bundle --no-sign -- --verbose

          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
            mobile: ""
            args: --target x86_64-apple-darwin --debug --verbose --no-bundle --no-sign -- --verbose

          - name: macOS arm64
            runner: macos-26
            target: aarch64-apple-darwin
            mobile: ""
            args: --target aarch64-apple-darwin --debug --verbose --no-bundle --no-sign -- --verbose

          - name: Linux x64 GNU
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            mobile: ""
            args: --target x86_64-unknown-linux-gnu --debug --verbose --no-bundle --no-sign -- --verbose

          - name: Linux arm64 GNU
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            mobile: ""
            args: --target aarch64-unknown-linux-gnu --debug --verbose --no-bundle --no-sign -- --verbose

          - name: Android arm64-v8a
            runner: ubuntu-24.04
            target: aarch64-linux-android
            mobile: android
            args: --ci --debug --apk --split-per-abi --target aarch64 --verbose

          - name: Android armeabi-v7a
            runner: ubuntu-24.04
            target: armv7-linux-androideabi
            mobile: android
            args: --ci --debug --apk --split-per-abi --target armv7 --verbose

          - name: Android x86
            runner: ubuntu-24.04
            target: i686-linux-android
            mobile: android
            args: --ci --debug --apk --split-per-abi --target i686 --verbose

          - name: Android x86_64
            runner: ubuntu-24.04
            target: x86_64-linux-android
            mobile: android
            args: --ci --debug --apk --split-per-abi --target x86_64 --verbose

          - name: Android universal
            runner: ubuntu-24.04
            target: |
              aarch64-linux-android
              armv7-linux-androideabi
              i686-linux-android
              x86_64-linux-android
            mobile: android
            args: --ci --debug --apk --verbose

          - name: iOS simulator
            runner: macos-15
            target: aarch64-apple-ios-sim
            mobile: ios
            args: --ci --debug --target aarch64-sim --verbose

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux native system dependencies
        if: ${{ startsWith(matrix.runner, 'ubuntu') && matrix.mobile == '' }}
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            lld \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain and targets
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        if: ${{ matrix.mobile == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: ${{ matrix.mobile == 'android' }}
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        if: ${{ matrix.mobile == 'android' }}
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;30.0.14904198"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.14904198" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.14904198" >> "$GITHUB_ENV"

      - name: Provide cargo-tauri wrapper for Xcode
        if: ${{ matrix.mobile == 'ios' }}
        shell: bash
        run: |
          mkdir -p "$HOME/.cargo/bin"
          cat <<'EOF' > "$HOME/.cargo/bin/cargo-tauri"
          #!/usr/bin/env bash
          if [[ "${1:-}" == "tauri" ]]; then
            shift
          fi
          exec pnpm tauri "$@"
          EOF
          chmod +x "$HOME/.cargo/bin/cargo-tauri"

      - name: Build Tauri target
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          mobile: ${{ matrix.mobile }}
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: false
          uploadPlainBinary: false
