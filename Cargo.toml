[package]
name = "hyperion"
version = "0.1.0"
description = "A multiplatform Matrix client"
authors = ["VinVel <dev+hyperion@velcore.net>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/VinVel/Hyperion"
homepage = "https://hyperion.velcore.net"

[workspace]
resolver = "3"

[lints.clippy]
all = "warn"
pedantic = "warn"
significant_drop_tightening = "warn"
redundant_pub_crate = "warn"
redundant_clone = "warn"
needless_collect = "warn"
useless_let_if_seq = "warn"
equatable_if_let = "warn"

[lib]
# The `_lib` suffix may seem redundant but it is necessary on Windows so the library name does not conflict with the binary.
name = "hyperion_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hyperion"
path = "src/main.rs"

[dependencies]
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.10.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rustls = "0.23.43"
rust-i18n = "4.2.1"
futures-util = "0.3"
tokio = { version = "1.53.1", features = ["full"] }
eyeball-im = "0.8"
# This revision avoids an EventCache pagination panic in the final persisted chunk.
matrix-sdk-crypto = { git = "https://github.com/matrix-org/matrix-rust-sdk", rev = "1c74383", default-features = false }
keyring-core = "1.0.0"

[dependencies.matrix-sdk]
git = "https://github.com/matrix-org/matrix-rust-sdk"
rev = "1c74383"
default-features = false
features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "bundled-sqlite",
    "experimental-search",
]

[dependencies.matrix-sdk-ui]
git = "https://github.com/matrix-org/matrix-rust-sdk"
rev = "1c74383"
default-features = false
features = ["unstable-msc4274"]

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
rustls-native-certs = "0.8.4"
webpki-roots = "1.0.9"
tracing-logcat = "0.1.0"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }
tracing-oslog = "0.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
tracing-etw = "0.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
tracing-oslog = "0.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-openssl"] }
tracing-journald = "0.3.2"

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = false
strip = true

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
