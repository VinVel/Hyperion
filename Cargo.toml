[workspace]
members = [
    "src-tauri", 
    "plugins/*"
    ]
resolver = "3"

[workspace.dependencies]
tauri-plugin-mobile-webview-overlay = { path = "plugins/tauri-plugin-mobile-webview-overlay" }
tauri-plugin-app-events = { path = "plugins/tauri-plugin-app-events" }
tauri = { version = "2.11.1", default-features = false }
tauri-build = "2.6.1"
tauri-plugin = "2.6.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-i18n = "2.0.2"
serde = "1"
serde_json = "1"
base64 = "0.22"
rand = "0.10.1"
rusqlite = "=0.37.0"
reqwest = { version = "0.13.3", default-features = false }
rust-i18n = "4.0.0"
futures-util = "0.3"
eyeball-im = "0.8"
matrix-sdk-base = { version = "0.17.0", default-features = false }
matrix-sdk = { version = "0.17.0", default-features = false }
matrix-sdk-ui = { version = "0.17.0", default-features = false }
keyring-core = "1.0.0"
android-native-keyring-store = "1.0.0"
apple-native-keyring-store = "1.0.0"
windows-native-keyring-store = "1.0.0"
linux-keyutils-keyring-store = "1.0.0"
thiserror = "2"

[profile.dev]
debug = true

[profile.dev.package."*"]
debug = false
strip = true

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
