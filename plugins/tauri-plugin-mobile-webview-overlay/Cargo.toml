[package]
name = "tauri-plugin-mobile-webview-overlay"
version = "0.1.0"
authors = [ "VinVel <dev+tauri-plugin-mobile-webview-overlay@velcore.net>"]
description = "A Plugin to create a native webview Overlay on mobile."
license = "MIT"
edition = "2024"
build = "build.rs"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile-webview-overlay"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true }
