[package]
name = "tauri-plugin-mobile-webview-overlay"
version = "0.1.0"
authors = [ "VinVel" ]
description = ""
edition = "2024"
rust-version = "1.93.1"
build = "build.rs"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
