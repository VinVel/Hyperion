[package]
name = "hyperion"
version = "0.1.0"
description = "A multiplatform Matrix client"
authors = ["VinVel <dev+hyperion@velcore.net>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/VinVel/Hyperion"
homepage = "https://hyperion.velcore.net"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hyperion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
rust-i18n = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
eyeball-im = { workspace = true }
matrix-sdk-crypto = { workspace = true }
keyring-core = { workspace = true }

[dependencies.matrix-sdk]
workspace = true
features = [
    "e2e-encryption", 
    "automatic-room-key-forwarding", 
    "bundled-sqlite", 
    "experimental-search",
]

[dependencies.matrix-sdk-ui]
workspace = true
features = [
    "unstable-msc4274"
]

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
tracing-logcat = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["protected"] }
tracing-oslog = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }
tracing-etw = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain"] }
tracing-oslog = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { workspace = true , features = ["rt-tokio-crypto-openssl"]}
tracing-journald = { workspace = true }
